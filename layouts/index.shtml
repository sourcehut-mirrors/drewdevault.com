<extend template="base.shtml">
<head id="head">
</head>
<body id="body">
	<main>
		<h1 :text="$page.title"></h1>

		<section class="articles" :loop="$site.page('blog').subpages()">
			<ctx :if="$loop.it.custom.getOr('noindex', false).not()">
				<div class="date" :text="$loop.it.date.format('January 02, 2006')"></div>
				<a href="$loop.it.link()" :text="$loop.it.title"></a>
			</ctx>
		</section>
	</main>
</body>
