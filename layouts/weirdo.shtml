<extend template="base.shtml">
<head id="head">
</head>
<body id="body">
	<main class="weirdos">
		<h1>Weird little guys of FOSS</h1>
		<h2 :text="$page.title"></h2>
		<article>
			<div id="$page.custom.get('id')" class="weird-guy">
				<img src="$site.asset($page.custom.get('profile')).link()">
				<ctx :html="$page.content()"></ctx>
				<p>
					<em>Added <ctx :text="$page.date.format('January 02, 2006')"></ctx></em>
				</p>
			</div>
			<hr>
			<a href="/weird-guys/">← Back to the list</a>
		</article>
	</main>
</body>
